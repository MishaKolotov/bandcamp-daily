name: neighbors

on:
  schedule:
    # Понедельник, 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Та же группа, что и у daily.yml — см. комментарий там. Оба джоба
  # коммитят в data/ и пушат в одну ветку; общая группа ставит их в
  # очередь друг за другом вместо гонки за push.
  group: bandcamp-daily-data-write
  cancel-in-progress: false

jobs:
  neighbors:
    runs-on: ubuntu-latest
    # bin/neighbors.ts сам оценивает потолок ~19 минут при холодном
    # прогоне (см. комментарий в файле) — 40 даёт запас, не ожидаемое время.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # bin/neighbors.ts не читает страницы релизов (album.ts) вообще — он
      # ходит только в JSON API коллекций и покупателей, ни один из которых
      # не кэшируется на диск (см. Http#getText — кэш только у GET-страниц,
      # а тут сплошь postJson). Поэтому .cache/ этому джобу не нужен и не
      # переносится между запусками — то же решение, что и в daily.yml, но
      # здесь оно даже не компромисс: переносить нечего.
      #
      # data/neighbors.json уже будет существовать в репозитории после
      # первого успешного запуска, а bin/neighbors.ts отказывается
      # перезаписывать существующий файл без --force (защита от случайной
      # потери руками собранного файла при локальном запуске) — поэтому
      # еженедельный CI-прогон обязан передавать --force явно, иначе он
      # будет падать на второй и каждой последующей неделе.
      - name: Пересчитать соседей
        run: npm run neighbors -- --force

      # Тот же fetch+rebase+retry, что и в daily.yml, и по той же причине:
      # между checkout и этим шагом прошло до ~20 минут, за которые
      # владелец мог запушить правку руками, либо daily.yml (общая
      # concurrency-группа снижает вероятность, но не исключает прямой push
      # владельца) мог уйти в origin первым. Коммитим только свой файл.
      - name: Сохранить соседей
        if: always()
        run: |
          set -euo pipefail
          git config user.name "bandcamp-daily-bot"
          git config user.email "bot@users.noreply.github.com"

          if [ ! -f data/neighbors.json ]; then
            echo "data/neighbors.json не создан за этот прогон — сохранять нечего."
            exit 0
          fi

          git add data/neighbors.json
          if git diff --staged --quiet; then
            echo "соседи не изменились — нечего коммитить."
            exit 0
          fi

          git commit -m "chore: пересчёт соседей за $(date -u +%F) [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "запушено (попытка $attempt/5)."
              exit 0
            fi
            echo "push отклонён — origin уехал вперёд (попытка $attempt/5), подтягиваю и переустанавливаю коммит поверх"
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "rebase столкнулся с конфликтом. Прерываю, коммит остаётся только в этом раннере и будет потерян; перезапустить джоб вручную." >&2
              git rebase --abort
              exit 1
            fi
          done

          echo "не удалось запушить соседей после 5 попыток." >&2
          exit 1
