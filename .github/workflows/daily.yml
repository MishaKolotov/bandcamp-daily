name: daily

on:
  schedule:
    # GitHub Actions не держит точное время: опоздание 5-30 минут — штатно,
    # под нагрузкой прогон может быть пропущен вовсе. Cron в UTC, поэтому
    # локальное время владельца плавает на час дважды в год при переходе
    # на летнее/зимнее — мирится, отдельного расписания под это не заводим.
    # 06:00 UTC — утро (08:00 Europe/Warsaw летом, 07:00 зимой)
    - cron: '0 6 * * *'
    # 15:00 UTC — вечер (17:00 Europe/Warsaw летом, 16:00 зимой)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Общая с neighbors-weekly группа: оба джоба пишут в data/ и коммитят в
  # одну ветку. GitHub Actions не гарантирует, что cron не наложится на
  # workflow_dispatch или что недельный пересчёт соседей не стартует
  # ровно тогда, когда daily ещё сидит в окне ожидания нажатий
  # (LISTEN_MINUTES, ~20 минут). Общая группа просто ставит второй джоб в
  # очередь вместо гонки за пуш — это дешевле и надёжнее, чем полагаться на
  # то, что утренний/вечерний прогоны daily и понедельничные 03:00 соседей
  # никогда не пересекутся на практике (ручной workflow_dispatch ломает это
  # предположение в любой момент).
  group: bandcamp-daily-data-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Сбор кандидатов (Discover, дискографии подписок, архив соседей) плюс
    # окно ожидания нажатий ~20 минут (LISTEN_MINUTES) — see bin/daily.ts.
    # 45 минут — бюджет с запасом, не ожидаемое время выполнения.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Дисковый кэш страниц релизов (.cache/) сознательно НЕ переносится
      # между запусками через actions/cache — см. разбор в README
      # ("Дисковый кэш" в разделе про CI). Кратко: этот джоб почти не читает
      # из кэша (архивные кандидаты и подписки в основном новые для .cache
      # каждый день), а сам кэш неограниченно растёт (уже сотни мегабайт
      # локально) — таскать растущий блоб туда-обратно каждый день дороже,
      # чем несколько лишних минут сети при холодном старте. Холодный кэш —
      # это только более медленный прогон, не поломка: HTTP-клиент и так
      # ограничен паузой между запросами, а 45-минутный таймаут уже
      # заложен с запасом.
      - name: Подобрать альбом и отправить владельцу
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          LISTEN_MINUTES: '20'
        run: npm run daily

      # Сохранить состояние безопасно, а не оптимистично: между checkout в
      # начале джоба и этим шагом прошло до 45 минут, и за это время
      # владелец мог руками поправить data/profile.json, либо недельный
      # пересчёт соседей (та же concurrency-группа, но это не защищает от
      # прямого push владельца) мог уйти в origin первым. Коммитим только
      # свой файл (data/state.json — profile.json и location-vocabulary.json
      # этот джоб не трогает и не должен затрагивать), и вместо голого
      # `git push`, который просто упал бы при разошедшемся origin, делаем
      # fetch+rebase+retry. Force push исключён сознательно: лучше отдельный
      # неудачный прогон CI, который владелец увидит и перезапустит, чем
      # молча затёртая чужая правка.
      - name: Сохранить состояние
        if: always()
        run: |
          set -euo pipefail
          git config user.name "bandcamp-daily-bot"
          git config user.email "bot@users.noreply.github.com"

          if [ ! -f data/state.json ]; then
            echo "data/state.json не создан за этот прогон — сохранять нечего (сбой до первой записи состояния)."
            exit 0
          fi

          git add data/state.json
          if git diff --staged --quiet; then
            echo "состояние не изменилось — нечего коммитить."
            exit 0
          fi

          git commit -m "chore: состояние за $(date -u +%F) [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "запушено (попытка $attempt/5)."
              exit 0
            fi
            echo "push отклонён — origin уехал вперёд (попытка $attempt/5), подтягиваю и переустанавливаю коммит поверх"
            git fetch origin "${{ github.ref_name }}"
            if ! git rebase "origin/${{ github.ref_name }}"; then
              echo "rebase столкнулся с конфликтом — кто-то одновременно правил тот же файл. Прерываю, коммит остаётся только в этом раннере и будет потерян; перезапустить джоб вручную." >&2
              git rebase --abort
              exit 1
            fi
          done

          echo "не удалось запушить состояние после 5 попыток." >&2
          exit 1
