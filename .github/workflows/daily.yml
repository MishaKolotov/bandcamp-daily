name: daily

on:
  schedule:
    # GitHub Actions не держит точное время: опоздание 5-30 минут — штатно,
    # под нагрузкой прогон может быть пропущен вовсе. Cron в UTC, поэтому
    # локальное время владельца плавает на час дважды в год при переходе
    # на летнее/зимнее — мирится, отдельного расписания под это не заводим.
    # Минуты НЕ ровные и это не косметика: ровное начало часа — самый забитый
    # слот планировщика Actions, и запуски там не просто опаздывают, а
    # выбрасываются целиком. 2026-08-10 заход, стоявший на 06:00 UTC, не
    # стартовал вовсе — ни в 06:00, ни через час; предыдущие три опоздали на
    # 56, 35 и 28 минут. Двадцатая минута — тот же час для владельца и заметно
    # менее людное время для GitHub.
    #
    # 06:20 UTC — утро (08:20 Europe/Warsaw летом, 07:20 зимой)
    - cron: '20 6 * * *'
    # 11:20 UTC — день (13:20 Europe/Warsaw летом, 12:20 зимой)
    - cron: '20 11 * * *'
    # 17:20 UTC — вечер (19:20 Europe/Warsaw летом, 18:20 зимой)
    - cron: '20 17 * * *'
    #
    # Три захода вместо двух. Цена решения, чтобы она не всплыла сюрпризом:
    # конечный пул кандидатов расходуется в полтора раза быстрее (спека
    # называет истощение пула главным долгосрочным риском схемы), а окно на
    # реакцию сжимается с девяти часов до пяти-шести — карточку, на которую
    # владелец не нажал, следующий заход сносит и помечает показанной. Порог
    # `MIN_TOTAL` при этом никуда не делся: заход, которому нечего предложить,
    # по-прежнему молчит, так что три захода в день — это потолок, а не норма.
  workflow_dispatch:

# Только чтение: джоб больше ничего не коммитит в репозиторий. Состояние
# подборщика (показанное, штрафы по тегам, жанр прошлого пика) живёт в Neon
# на стороне сайта, и вместе с шагом сохранения отсюда ушла вся гонка за
# пуш — а с ней и нужда в группе concurrency: она защищала от одновременной
# записи в data/ этим джобом и недельным воркфлоу пересчёта архивного пула,
# которого в репозитории больше нет (архивная ветка пайплайна удалена).
permissions:
  contents: read

jobs:
  daily:
    runs-on: ubuntu-latest
    # Сбор кандидатов: коллекция и вишлист владельца, дискографии всех
    # подписок, Discover по хаб-тегам пяти бакетов.
    # При паузе 900 мс между запросами (см. `minDelayMs` в bin/daily.ts) это
    # порядка получаса на холодном кэше.
    #
    # 45 минут — не наследие старой схемы с окном ожидания нажатий, а
    # измеренная величина: попытка урезать бюджет до 20 минут «раз окна
    # ожидания больше нет» кончилась отменённым по таймауту прогоном
    # (run 31261893740, 2026-08-08), который на 16-й минуте разбирал всего
    # лишь третий бакет из пяти. Ожидание нажатий действительно ушло, но
    # узким местом оно никогда и не было.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Дисковый кэш страниц релизов (.cache/) сознательно НЕ переносится
      # между запусками через actions/cache — см. разбор в README
      # ("Дисковый кэш" в разделе про CI). Кратко: этот джоб почти не читает
      # из кэша (свежие кандидаты по определению новые для .cache
      # каждый день), а сам кэш неограниченно растёт (уже сотни мегабайт
      # локально) — таскать растущий блоб туда-обратно каждый день дороже,
      # чем несколько лишних минут сети при холодном старте. Холодный кэш —
      # это только более медленный прогон, не поломка: HTTP-клиент и так
      # ограничен паузой между запросами, а 45-минутный таймаут уже
      # заложен с запасом.
      - name: Подобрать альбом и отдать сайту
        env:
          # Тот же секрет, что в переменных окружения Vercel у
          # gigamike666.com — им джоб представляется эндпоинтам
          # /api/picker/*. Разошлись — сайт ответит 401 и джоб покраснеет.
          PICKER_SECRET: ${{ secrets.PICKER_SECRET }}
        run: npm run daily
